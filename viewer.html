<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Element Blur — Screenshot</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background: #111827;
        color: #e5e7eb;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      header {
        display: flex;
        gap: 8px;
        align-items: center;
        padding: 12px 16px;
        background: rgba(255, 255, 255, 0.04);
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }
      h1 {
        flex: 1;
        margin: 0;
        font-size: 14px;
        font-weight: 600;
      }
      button {
        cursor: pointer;
        font: inherit;
        font-size: 13px;
        padding: 6px 12px;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: rgba(255, 255, 255, 0.06);
        color: inherit;
      }
      button:hover {
        background: rgba(255, 255, 255, 0.12);
      }
      button:disabled {
        opacity: 0.4;
        cursor: default;
      }
      main {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        overflow: auto;
      }
      img {
        max-width: 100%;
        height: auto;
        background: #fff;
        border-radius: 8px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
      }
      #message {
        max-width: 42ch;
        text-align: center;
        line-height: 1.5;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Element Blur — screenshot</h1>
      <button id="download" type="button">Download PNG</button>
      <button id="close" type="button">Close</button>
    </header>
    <main>
      <img id="shot" alt="Captured page screenshot with the applied blur and highlight effects" hidden />
      <p id="message" hidden></p>
    </main>
    <script src="viewer.js"></script>
  </body>
</html>
